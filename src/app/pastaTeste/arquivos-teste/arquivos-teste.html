<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sprint-Angular</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main>
        <div class="flex">
            <img src="" alt="Ranger" class="h-auto w-full max-w-[900px] object-contain lg:w-1/2">

            <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8 ">
                <img src="ford.png" alt="Logo" width="200" class="mx-auto">
                <div class="sm:mx-auto sm:w-full sm:max-w-sm">

                    <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Boas-Vindas</h2>
                </div>

                <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm ">
                    <form action="#" method="POST" class="space-y-6">
                        <div>
                            <label for="email" class="block text-sm/6 font-medium text-gray-900">Insira seu
                                e-mail</label>
                            <div class="mt-2">
                                <input id="email" type="email" name="email" required autocomplete="email"
                                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between">
                                <label for="password" class="block text-sm/6 font-medium text-gray-900">Insira sua
                                    senha</label>

                            </div>
                            <div class="mt-2">
                                <input id="password" type="password" name="password" required
                                    autocomplete="current-password"
                                    class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6" />
                            </div>

                        </div>
                        <div class="flex items-center gap-3">
                            <p>Logar automaticamente</p>
                            <label for="hs-basic-usage" class="relative inline-block w-11 h-6 cursor-pointer">

                                <input type="checkbox" id="hs-basic-usage" class="peer sr-only">
                                <span
                                    class="absolute inset-0 rounded-full bg-gray-300 transition-colors duration-200 ease-in-out peer-checked:bg-indigo-600 peer-disabled:opacity-50 peer-disabled:pointer-events-none"></span>
                                <span
                                    class="absolute top-1/2 inset-s-0.5 -translate-y-1/2 size-5 rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out peer-checked:translate-x-full"></span>
                            </label>
                        </div>

                        <div>
                            <button type="submit"
                                class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Entrar</button>
                        </div>
                    </form>


                </div>
            </div>
